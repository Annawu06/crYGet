name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y cmake g++ make pkg-config dpkg-dev desktop-file-utils libx11-dev libxft-dev libfontconfig1-dev libcurl4-openssl-dev libjpeg-dev libnode-dev libuv1-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: CRYGET_VERSION=2026.10.08+debian13 OUTPUT_DIR=dist bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cryget-2026.10.08-debian13
          path: dist/cryget_2026.10.08+debian13_amd64.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-libuv
            mingw-w64-ucrt-x86_64-nsis
      - shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNODE_ROOT="$MINGW_PREFIX"
      - shell: msys2 {0}
        run: cmake --build build --parallel
      - shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Build Windows installer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          NODE_ROOT="$MINGW_PREFIX" bash scripts/build-windows.sh
          mv build-windows/crYGet-Setup.exe build-windows/crYGet-Setup-2026.10.08-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: cryget-2026.10.08-windows-x64
          path: build-windows/crYGet-Setup-2026.10.08-windows-x64.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cryget-2026.10.08-debian13
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cryget-2026.10.08-windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2026.10.08 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v2026.10.08 already exists.'
            exit 0
          fi
          gh release create v2026.10.08 \
            dist/cryget_2026.10.08+debian13_amd64.deb \
            dist/crYGet-Setup-2026.10.08-windows-x64.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'crYGet 2026.10.08' \
            --notes-file RELEASE_NOTES.md
