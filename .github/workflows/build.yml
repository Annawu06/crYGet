name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y cmake g++ make pkg-config dpkg-dev desktop-file-utils libx11-dev libxft-dev libfontconfig1-dev libcurl4-openssl-dev libjpeg-dev libavformat-dev libavcodec-dev libavutil-dev libnode-dev libuv1-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: CRYGET_VERSION=2026.10.08+debian13 OUTPUT_DIR=dist bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cryget-2026.10.08-debian13
          path: dist/cryget_2026.10.08+debian13_amd64.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-libuv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-nsis
            make
            curl
            tar
            xz
            diffutils
      - shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="$MINGW_PREFIX" -DNODE_ROOT="$MINGW_PREFIX"
      - shell: msys2 {0}
        run: cmake --build build --parallel
      - shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Build LGPL FFmpeg and Windows installer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz --output ffmpeg-9.0.2.tar.xz
          mkdir -p ffmpeg-source
          tar -xf ffmpeg-9.0.2.tar.xz --strip-components=1 -C ffmpeg-source
          export FFMPEG_ROOT="$PWD/ffmpeg-install"
          cd ffmpeg-source
          ./configure \
            --prefix="$FFMPEG_ROOT" \
            --target-os=mingw32 --arch=x86_64 \
            --cross-prefix=x86_64-w64-mingw32- --enable-cross-compile \
            --enable-shared --disable-static --disable-programs --disable-doc \
            --disable-debug --disable-autodetect --disable-x86asm \
            --disable-gpl --disable-version3 --disable-nonfree
          grep -q '^#define CONFIG_GPL 0$' config.h
          grep -q '^#define CONFIG_NONFREE 0$' config.h
          make -j2
          make install
          cp COPYING.LGPLv2.1 "$FFMPEG_ROOT/"
          cd ..
          cmake -S . -B build-windows-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_ROOT="$FFMPEG_ROOT" -DNODE_ROOT="$MINGW_PREFIX"
          cmake --build build-windows-release --parallel
          PATH="$FFMPEG_ROOT/bin:$PATH" ctest --test-dir build-windows-release --output-on-failure
          FFMPEG_SOURCE_DIR="$PWD/ffmpeg-source" FFMPEG_SOURCE_ARCHIVE="$PWD/ffmpeg-9.0.2.tar.xz" NODE_ROOT="$MINGW_PREFIX" bash scripts/build-windows.sh
          mv build-windows/crYGet-Setup.exe build-windows/crYGet-Setup-2026.10.08-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: cryget-2026.10.08-windows-x64
          path: build-windows/crYGet-Setup-2026.10.08-windows-x64.exe
          if-no-files-found: error
