name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: debian:forky
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y cmake g++ make pkg-config dpkg-dev desktop-file-utils libx11-dev libxft-dev libfontconfig1-dev libcurl4-openssl-dev libjpeg-dev libnode-dev libuv1-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: CRYGET_VERSION=2026.10.08.9+debian.forky OUTPUT_DIR=dist bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cryget-2026.10.08.9-debian-forky
          path: dist/cryget_2026.10.08.9+debian.forky_amd64.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-libuv
      - shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNODE_ROOT="$MINGW_PREFIX"
      - shell: msys2 {0}
        run: cmake --build build --parallel
      - shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Install standard NSIS launcher
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build Windows installer
        shell: msys2 {0}
        env:
          NSIS_MAKENSIS: 'C:\Program Files (x86)\NSIS\makensis.exe'
        run: |
          set -euo pipefail
          NODE_ROOT="$MINGW_PREFIX" bash scripts/build-windows.sh
          mv build-windows/crYGet-Setup.exe build-windows/crYGet-Setup-2026.10.08.9-windows-x64.exe
      - name: Build Windows portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = 'build-windows/crYGet'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item 'build-windows/cryget-desktop.exe' $portable
          Copy-Item 'build-windows/runtime/*' $portable
          Copy-Item 'build-windows/licenses' "$portable/licenses" -Recurse
          Compress-Archive -Path $portable -DestinationPath 'build-windows/crYGet-2026.10.08.9-windows-x64-portable.zip'
      - name: Verify Windows installation and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'crYGet smoke test'
          $setup = Start-Process -FilePath 'build-windows/crYGet-Setup-2026.10.08.9-windows-x64.exe' -ArgumentList "/S /D=$installDir" -PassThru
          if (-not $setup.WaitForExit(120000)) { $setup.Kill(); throw 'Installer did not finish' }
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $exe = Join-Path $installDir 'cryget-desktop.exe'
          if (-not (Test-Path $exe)) { throw 'Installer did not install crYGet' }
          $uiCheck = Start-Process -FilePath $exe -ArgumentList '--ui-self-test' -WorkingDirectory $installDir -PassThru
          if (-not $uiCheck.WaitForExit(30000)) { $uiCheck.Kill(); throw 'Windows UI test did not finish' }
          if ($uiCheck.ExitCode -ne 0) { throw "Windows UI test exited with $($uiCheck.ExitCode)" }
          $app = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru
          try {
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw "Installed application exited with $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { break }
            }
            if ($app.MainWindowHandle -eq 0) { throw 'Installed application did not open a window' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Installer did not create an uninstaller' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru
          if (-not $uninstall.WaitForExit(120000)) { $uninstall.Kill(); throw 'Uninstaller did not finish' }
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          if (Test-Path $exe) { throw 'Uninstaller left the application executable behind' }
      - name: Verify Windows portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = Join-Path $env:RUNNER_TEMP 'crYGet portable smoke test'
          Expand-Archive -Path 'build-windows/crYGet-2026.10.08.9-windows-x64-portable.zip' -DestinationPath $unpacked
          $exe = Join-Path $unpacked 'crYGet/cryget-desktop.exe'
          if (-not (Test-Path $exe)) { throw 'Portable archive is missing the application' }
          $check = Start-Process -FilePath $exe -ArgumentList '--ui-self-test' -WorkingDirectory (Split-Path $exe) -PassThru
          if (-not $check.WaitForExit(30000)) { $check.Kill(); throw 'Portable UI test did not finish' }
          if ($check.ExitCode -ne 0) { throw "Portable UI test exited with $($check.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: cryget-2026.10.08.9-windows-x64
          path: |
            build-windows/crYGet-Setup-2026.10.08.9-windows-x64.exe
            build-windows/crYGet-2026.10.08.9-windows-x64-portable.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cryget-2026.10.08.9-debian-forky
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cryget-2026.10.08.9-windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2026.10.08.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v2026.10.08.9 already exists.'
            exit 0
          fi
          gh release create v2026.10.08.9 \
            dist/cryget_2026.10.08.9+debian.forky_amd64.deb \
            dist/crYGet-Setup-2026.10.08.9-windows-x64.exe \
            dist/crYGet-2026.10.08.9-windows-x64-portable.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'crYGet 2026.10.08.9' \
            --notes-file RELEASE_NOTES.md
